services:
  efl-workflow-db:
    image: postgres:16-alpine
    container_name: efl-workflow-db
    restart: always
    environment:
      POSTGRES_USER: efl_user
      POSTGRES_PASSWORD: efl_password_2026
      POSTGRES_DB: efl_workflow_db
    ports:
      - "5433:5432"
    volumes:
      - efl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U efl_user -d efl_workflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  efl-workflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: efl-workflow-app
    restart: always
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - DATABASE_URL=postgresql://efl_user:efl_password_2026@efl-workflow-db:5432/efl_workflow_db?schema=public
      - RESEND_API_KEY=placeholder_resend_api_key
      - LINE_CHANNEL_ACCESS_TOKEN=placeholder_line_token
    depends_on:
      efl-workflow-db:
        condition: service_healthy

volumes:
  efl_pgdata:
